<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge & Fend: Fantasy Tycoon — Fase 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d12;
    color: #e0d8c8;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  .container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  @media (min-width: 900px) {
    .container { flex-direction: row; }
    #factoryCanvas { flex: 1.5; }
    #battleCanvas  { flex: 1; }
  }
  canvas {
    display: block;
    background: #1a1520;
    width: 100%;
  }
  #factoryCanvas { flex: 1.2; min-height: 50vh; }
  #battleCanvas  { flex: 0.8; min-height: 30vh; border-top: 2px solid #3a2a1a; }
  .ui {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(10, 8, 6, 0.9);
    border: 1px solid #5a4a3a;
    padding: 10px 14px;
    border-radius: 6px;
    min-width: 200px;
    font-size: 13px;
    line-height: 1.5;
    z-index: 10;
  }
  .ui h2 { font-size: 15px; color: #d4a574; margin-bottom: 6px; }
  .resource { display: flex; justify-content: space-between; }
  .buttons {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  button {
    background: #2a2218;
    color: #e0d8c8;
    border: 1px solid #5a4a3a;
    padding: 5px 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  button:hover { background: #3a3228; }
  button.active { background: #5a4a2a; border-color: #d4a574; }
  .wave-info { margin-top: 8px; color: #c07050; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <canvas id="factoryCanvas"></canvas>
  <canvas id="battleCanvas"></canvas>
</div>

<div class="ui">
  <h2>Forge & Fend — Fase 2</h2>
  <div class="resource"><span>Oro</span><span id="gold">100</span></div>
  <div class="resource"><span>Hierro</span><span id="iron">0</span></div>
  <div class="resource"><span>Maná</span><span id="mana">0</span></div>
  <div class="resource"><span>Espadas</span><span id="swords">0</span></div>
  <div class="wave-info">
    Oleada: <span id="wave">1</span> &nbsp; HP: <span id="enemyHp">10</span>
  </div>
  <div class="buttons">
    <button id="btnIron" onclick="selectPlace('iron')">Extractor Hierro (15 oro)</button>
    <button id="btnMana" onclick="selectPlace('mana')">Extractor Maná (15 oro)</button>
    <button id="btnForge" onclick="selectPlace('forge')">Nodo de Forja (40 oro)</button>
    <button id="btnPath" onclick="selectPlace('path')">Camino (5 oro)</button>
    <button onclick="selectPlace(null)">Cancelar</button>
  </div>
</div>

<script>
const state = {
  gold: 100,
  iron: 0,
  mana: 0,
  swords: 0,
  wave: 1,
  enemyHp: 10,
  enemyMaxHp: 10,
  selectedPlace: null,
  grid: Array.from({ length: 8 }, () => Array(8).fill(null)),
  // Recursos en movimiento: { type, gx, gy, progress, nextGx, nextGy, path }
  moving: [],
  // Buffers locales en forjas: { gx, gy, iron, mana }
  forgeBuffers: new Map(),
};

const TILE_W = 64;
const TILE_H = 32;
const GRID = 8;
const ORIGIN_X = 280;
const ORIGIN_Y = 40;
const DIRS = [[0,1],[1,0],[0,-1],[-1,0]];

function gridToScreen(gx, gy) {
  return {
    x: ORIGIN_X + (gx - gy) * (TILE_W / 2),
    y: ORIGIN_Y + (gx + gy) * (TILE_H / 2)
  };
}

function screenToGrid(sx, sy) {
  const relX = sx - ORIGIN_X;
  const relY = sy - ORIGIN_Y;
  const gx = (relX / (TILE_W / 2) + relY / (TILE_H / 2)) / 2;
  const gy = (relY / (TILE_H / 2) - relX / (TILE_W / 2)) / 2;
  return { x: Math.round(gx), y: Math.round(gy) };
}

function isValid(x, y) {
  return x >= 0 && x < GRID && y >= 0 && y < GRID;
}

// BFS simple para encontrar camino hasta la forja más cercana
function findPathToForge(startX, startY) {
  const queue = [[startX, startY, []]];
  const visited = new Set([`${startX},${startY}`]);

  while (queue.length) {
    const [x, y, path] = queue.shift();
    const node = state.grid[y][x];
    if (node?.type === 'forge') return path.concat([[x, y]]);

    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      const key = `${nx},${ny}`;
      if (!isValid(nx, ny) || visited.has(key)) continue;
      const n = state.grid[ny][nx];
      if (n && (n.type === 'path' || n.type === 'forge')) {
        visited.add(key);
        queue.push([nx, ny, path.concat([[x, y]])]);
      }
    }
  }
  return null;
}

const TICK_MS = 800;
let lastTick = performance.now();

function simulationTick() {
  const now = performance.now();
  if (now - lastTick < TICK_MS) return;
  lastTick = now;

  // Extractores generan recursos si hay camino a una forja
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const node = state.grid[y][x];
      if (!node || (node.type !== 'iron' && node.type !== 'mana')) continue;

      const path = findPathToForge(x, y);
      if (!path || path.length < 2) continue;

      // Spawn recurso que empieza a moverse
      state.moving.push({
        type: node.type,
        gx: x,
        gy: y,
        progress: 0,
        path: path.slice(1), // resto del camino
        pathIndex: 0
      });
    }
  }

  // Mover recursos (un paso por tick)
  for (let i = state.moving.length - 1; i >= 0; i--) {
    const item = state.moving[i];
    item.progress += 1;

    if (item.progress >= 1) {
      item.progress = 0;
      if (item.pathIndex < item.path.length - 1) {
        const [nx, ny] = item.path[item.pathIndex];
        item.gx = nx;
        item.gy = ny;
        item.pathIndex++;
      } else {
        // Llegó a la forja
        const [fx, fy] = item.path[item.path.length - 1];
        const key = `${fx},${fy}`;
        if (!state.forgeBuffers.has(key)) {
          state.forgeBuffers.set(key, { iron: 0, mana: 0 });
        }
        const buf = state.forgeBuffers.get(key);
        if (item.type === 'iron') buf.iron++;
        if (item.type === 'mana') buf.mana++;

        // Procesar si hay suficientes materiales
        if (buf.iron >= 2 && buf.mana >= 1) {
          buf.iron -= 2;
          buf.mana -= 1;
          state.swords++;
        }

        state.moving.splice(i, 1);
      }
    }
  }

  // Daño con espadas
  const dmgPerSword = 4;
  while (state.swords > 0 && state.enemyHp > 0) {
    state.swords--;
    state.enemyHp -= dmgPerSword;
  }

  if (state.enemyHp <= 0) {
    const reward = 8 + state.wave * 2;
    state.gold += reward;
    state.wave++;
    state.enemyMaxHp = Math.floor(10 * Math.pow(1.15, state.wave - 1));
    state.enemyHp = state.enemyMaxHp;
  }

  updateUI();
}

const factoryCanvas = document.getElementById('factoryCanvas');
const battleCanvas  = document.getElementById('battleCanvas');
const fCtx = factoryCanvas.getContext('2d');
const bCtx = battleCanvas.getContext('2d');

function resizeCanvases() {
  factoryCanvas.width  = factoryCanvas.clientWidth;
  factoryCanvas.height = factoryCanvas.clientHeight;
  battleCanvas.width   = battleCanvas.clientWidth;
  battleCanvas.height  = battleCanvas.clientHeight;
}
window.addEventListener('resize', resizeCanvases);
resizeCanvases();

function drawDiamond(ctx, x, y, color) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + TILE_W / 2, y + TILE_H / 2);
  ctx.lineTo(x, y + TILE_H);
  ctx.lineTo(x - TILE_W / 2, y + TILE_H / 2);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function renderFactory() {
  fCtx.clearRect(0, 0, factoryCanvas.width, factoryCanvas.height);

  // Tiles
  for (let gy = GRID - 1; gy >= 0; gy--) {
    for (let gx = 0; gx < GRID; gx++) {
      const { x, y } = gridToScreen(gx, gy);
      const node = state.grid[gy][gx];
      let color = '#2a2218';
      if (node?.type === 'iron')  color = '#6a5a3a';
      if (node?.type === 'mana')  color = '#3a4a6a';
      if (node?.type === 'forge') color = '#6a3a2a';
      if (node?.type === 'path')  color = '#4a3a5a';
      drawDiamond(fCtx, x, y, color);
    }
  }

  // Recursos en movimiento (partículas)
  for (const item of state.moving) {
    const { x, y } = gridToScreen(item.gx, item.gy);
    const color = item.type === 'iron' ? '#c0a060' : '#60a0c0';
    fCtx.fillStyle = color;
    fCtx.beginPath();
    fCtx.arc(x, y + 8, 5, 0, Math.PI * 2);
    fCtx.fill();
  }
}

function renderBattle() {
  const w = battleCanvas.width;
  const h = battleCanvas.height;
  bCtx.clearRect(0, 0, w, h);
  bCtx.fillStyle = '#1a1520';
  bCtx.fillRect(0, 0, w, h);

  const pathY = h * 0.55;
  bCtx.strokeStyle = '#5a4a3a';
  bCtx.lineWidth = 14;
  bCtx.lineCap = 'round';
  bCtx.beginPath();
  bCtx.moveTo(30, pathY);
  bCtx.lineTo(w - 30, pathY);
  bCtx.stroke();

  bCtx.fillStyle = '#3a2a1a';
  bCtx.fillRect(w - 50, pathY - 40, 40, 80);
  bCtx.fillStyle = '#2a1a0a';
  bCtx.fillRect(w - 45, pathY - 30, 30, 60);
  bCtx.fillStyle = '#d4a574';
  bCtx.font = '12px Courier New';
  bCtx.textAlign = 'center';
  bCtx.fillText('CASTILLO', w - 30, pathY + 55);

  const progress = Math.max(0, 1 - (state.enemyHp / state.enemyMaxHp));
  const ex = 40 + progress * (w - 90);
  const ey = pathY;

  bCtx.fillStyle = '#a03030';
  bCtx.beginPath();
  bCtx.arc(ex, ey, 18, 0, Math.PI * 2);
  bCtx.fill();
  bCtx.strokeStyle = '#600000';
  bCtx.lineWidth = 2;
  bCtx.stroke();

  const barW = 100;
  const barX = ex - barW / 2;
  const barY = ey - 35;
  bCtx.fillStyle = '#222';
  bCtx.fillRect(barX, barY, barW, 8);
  bCtx.fillStyle = '#c04040';
  const hpRatio = Math.max(0, state.enemyHp / state.enemyMaxHp);
  bCtx.fillRect(barX, barY, barW * hpRatio, 8);
  bCtx.strokeStyle = '#444';
  bCtx.strokeRect(barX, barY, barW, 8);

  bCtx.fillStyle = '#e0d8c8';
  bCtx.font = 'bold 14px Courier New';
  bCtx.textAlign = 'left';
  bCtx.fillText(`Oleada ${state.wave}`, 12, 24);
  bCtx.font = '12px Courier New';
  bCtx.fillText(`HP: ${Math.max(0, state.enemyHp)} / ${state.enemyMaxHp}`, 12, 42);
}

function render() {
  renderFactory();
  renderBattle();
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function selectPlace(type) {
  state.selectedPlace = type;
  document.querySelectorAll('.buttons button').forEach(b => b.classList.remove('active'));
  if (type === 'iron')  document.getElementById('btnIron').classList.add('active');
  if (type === 'mana')  document.getElementById('btnMana').classList.add('active');
  if (type === 'forge') document.getElementById('btnForge').classList.add('active');
  if (type === 'path')  document.getElementById('btnPath').classList.add('active');
}

factoryCanvas.addEventListener('click', (e) => {
  if (!state.selectedPlace) return;
  const rect = factoryCanvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const { x: gx, y: gy } = screenToGrid(sx, sy);

  if (!isValid(gx, gy)) return;
  if (state.grid[gy][gx]) return;

  const costs = { iron: 15, mana: 15, forge: 40, path: 5 };
  const cost = costs[state.selectedPlace];
  if (state.gold < cost) return;

  state.gold -= cost;
  state.grid[gy][gx] = { type: state.selectedPlace };
  updateUI();
});

function updateUI() {
  document.getElementById('gold').textContent   = state.gold;
  document.getElementById('iron').textContent   = state.iron;
  document.getElementById('mana').textContent   = state.mana;
  document.getElementById('swords').textContent = state.swords;
  document.getElementById('wave').textContent   = state.wave;
  document.getElementById('enemyHp').textContent = Math.max(0, state.enemyHp);
}

setInterval(simulationTick, 100);
updateUI();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge & Fend: Fantasy Tycoon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d12;
    color: #e0d8c8;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  .container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  @media (min-width: 1000px) {
    .container { flex-direction: row; }
    #factoryCanvas { flex: 1.6; }
    #battleCanvas  { flex: 0.9; }
  }
  canvas {
    display: block;
    background: #1a1520;
    width: 100%;
  }
  #factoryCanvas { flex: 1.3; min-height: 55vh; }
  #battleCanvas  { flex: 0.9; min-height: 32vh; border-top: 2px solid #3a2a1a; }
  .ui {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(10, 8, 6, 0.95);
    border: 1px solid #5a4a3a;
    padding: 12px 16px;
    border-radius: 6px;
    min-width: 250px;
    font-size: 13px;
    line-height: 1.5;
    z-index: 10;
    max-height: 92vh;
    overflow-y: auto;
  }
  .ui h2 { font-size: 16px; color: #d4a574; margin-bottom: 8px; }
  .resource { display: flex; justify-content: space-between; }
  .section { margin-top: 10px; border-top: 1px solid #3a2a1a; padding-top: 8px; }
  .section-title { color: #c09060; font-size: 12px; margin-bottom: 4px; }
  .buttons { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  button {
    background: #2a2218;
    color: #e0d8c8;
    border: 1px solid #5a4a3a;
    padding: 5px 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  button:hover { background: #3a3228; }
  button.active { background: #5a4a2a; border-color: #d4a574; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .wave-info { color: #c07050; font-weight: bold; }
  .hint { font-size: 11px; color: #a09070; margin-top: 6px; }
  .status { font-size: 12px; margin-top: 4px; color: #80c080; }
  .status.bad { color: #c07050; }
  .selected { color: #d4a574; font-weight: bold; }
  .upgrade-btn { font-size: 11px; padding: 4px 6px; }
</style>
</head>
<body>
<div class="container">
  <canvas id="factoryCanvas"></canvas>
  <canvas id="battleCanvas"></canvas>
</div>

<div class="ui">
  <h2>Forge & Fend</h2>
  <div class="resource"><span>Oro</span><span id="gold">100</span></div>
  <div class="resource"><span>Espadas listas</span><span id="swords">0</span></div>

  <div class="section">
    <div class="section-title">MATERIALES EN FORJAS</div>
    <div class="resource"><span>Hierro</span><span id="ironBuf">0</span></div>
    <div class="resource"><span>Maná</span><span id="manaBuf">0</span></div>
  </div>

  <div class="section">
    <div class="section-title">PODER DE ATAQUE</div>
    <div class="resource"><span>Daño / espada</span><span id="dmg">4</span></div>
    <div class="resource"><span>Espadas esta oleada</span><span id="swordsThisWave">0</span></div>
  </div>

  <div class="section">
    <div class="section-title wave-info">OLEADA <span id="wave">1</span></div>
    <div class="resource"><span>HP enemigo</span><span id="enemyHp">10 / 10</span></div>
    <div class="resource"><span>Progreso</span><span id="waveProg">0%</span></div>
    <div id="flowStatus" class="status">Comprobando flujo...</div>
  </div>

  <div class="section">
    <div class="section-title">MEJORAS</div>
    <div class="buttons">
      <button class="upgrade-btn" id="btnUpDmg" onclick="buyUpgrade('dmg')">+1 Daño (<span id="costDmg">50</span> oro)</button>
      <button class="upgrade-btn" id="btnUpProd" onclick="buyUpgrade('prod')">+Vel. Producción (<span id="costProd">40</span> oro)</button>
      <button class="upgrade-btn" id="btnUpSpeed" onclick="buyUpgrade('speed')">+Vel. Transporte (<span id="costSpeed">30</span> oro)</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">CONSTRUYENDO</div>
    <div id="selectedText" class="selected">Nada seleccionado</div>
    <div class="buttons">
      <button id="btnIron" onclick="selectPlace('iron')">Extractor Hierro (15)</button>
      <button id="btnMana" onclick="selectPlace('mana')">Extractor Maná (15)</button>
      <button id="btnForge" onclick="selectPlace('forge')">Forja (40)</button>
      <button id="btnPath" onclick="selectPlace('path')">Camino (5)</button>
      <button onclick="selectPlace(null)">Cancelar</button>
    </div>
  </div>
  <div class="hint">Selecciona y haz clic en la rejilla.</div>
  <div class="hint" id="saveStatus">Guardado automático activo</div>
</div>

<script>
const SAVE_KEY = 'forgeAndFend_save_v1';

const state = {
  gold: 100,
  swords: 0,
  wave: 1,
  enemyHp: 10,
  enemyMaxHp: 10,
  selectedPlace: null,
  grid: Array.from({ length: 8 }, () => Array(8).fill(null)),
  moving: [],
  forgeBuffers: new Map(),
  swordsThisWave: 0,
  dmgPerSword: 4,
  prodLevel: 1,
  speedLevel: 1,
  hasActiveFlow: false,
};

const TILE_W = 92;
const TILE_H = 46;
const GRID = 8;
let ORIGIN_X = 300;
let ORIGIN_Y = 60;
const DIRS = [[0,1],[1,0],[0,-1],[-1,0]];

function updateOrigin() {
  const w = factoryCanvas.width;
  const h = factoryCanvas.height;
  const gridPixelH = GRID * (TILE_H / 2);
  ORIGIN_X = w / 2;
  ORIGIN_Y = Math.max(40, (h - gridPixelH) / 2 - 10);
}

function gridToScreen(gx, gy) {
  return {
    x: ORIGIN_X + (gx - gy) * (TILE_W / 2),
    y: ORIGIN_Y + (gx + gy) * (TILE_H / 2)
  };
}

function screenToGrid(sx, sy) {
  const relX = sx - ORIGIN_X;
  const relY = sy - ORIGIN_Y - (TILE_H / 2);
  const gx = (relX / (TILE_W / 2) + relY / (TILE_H / 2)) / 2;
  const gy = (relY / (TILE_H / 2) - relX / (TILE_W / 2)) / 2;
  return { x: Math.round(gx), y: Math.round(gy) };
}

function isValid(x, y) {
  return x >= 0 && x < GRID && y >= 0 && y < GRID;
}

function findPathToForge(startX, startY) {
  const queue = [[startX, startY, []]];
  const visited = new Set([`${startX},${startY}`]);

  while (queue.length) {
    const [x, y, path] = queue.shift();
    const node = state.grid[y][x];
    if (node?.type === 'forge') return path.concat([[x, y]]);

    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      const key = `${nx},${ny}`;
      if (!isValid(nx, ny) || visited.has(key)) continue;
      const n = state.grid[ny][nx];
      if (n && (n.type === 'path' || n.type === 'forge')) {
        visited.add(key);
        queue.push([nx, ny, path.concat([[x, y]])]);
      }
    }
  }
  return null;
}

function getTotalBuffers() {
  let iron = 0, mana = 0;
  for (const buf of state.forgeBuffers.values()) {
    iron += buf.iron;
    mana += buf.mana;
  }
  return { iron, mana };
}

function getUpgradeCost(type) {
  if (type === 'dmg') return Math.floor(50 * Math.pow(1.6, state.dmgPerSword - 4));
  if (type === 'prod') return Math.floor(40 * Math.pow(1.5, state.prodLevel - 1));
  if (type === 'speed') return Math.floor(30 * Math.pow(1.4, state.speedLevel - 1));
  return 999;
}

function buyUpgrade(type) {
  const cost = getUpgradeCost(type);
  if (state.gold < cost) return;
  state.gold -= cost;
  if (type === 'dmg') state.dmgPerSword++;
  if (type === 'prod') state.prodLevel++;
  if (type === 'speed') state.speedLevel++;
  saveGame();
  updateUI();
}

function saveGame() {
  const data = {
    gold: state.gold,
    wave: state.wave,
    enemyHp: state.enemyHp,
    enemyMaxHp: state.enemyMaxHp,
    grid: state.grid,
    dmgPerSword: state.dmgPerSword,
    prodLevel: state.prodLevel,
    speedLevel: state.speedLevel,
    swordsThisWave: state.swordsThisWave,
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  document.getElementById('saveStatus').textContent = 'Guardado';
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    Object.assign(state, data);
    state.forgeBuffers = new Map();
    state.moving = [];
    state.swords = 0;
  } catch (e) {}
}

let tickAccumulator = 0;
const BASE_TICK = 650;

function simulationTick(dt) {
  tickAccumulator += dt;
  const tickInterval = BASE_TICK / state.speedLevel;

  if (tickAccumulator < tickInterval) return;
  tickAccumulator -= tickInterval;

  state.hasActiveFlow = false;

  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const node = state.grid[y][x];
      if (!node || (node.type !== 'iron' && node.type !== 'mana')) continue;

      const path = findPathToForge(x, y);
      if (!path || path.length < 2) continue;

      state.hasActiveFlow = true;

      if (Math.random() < 0.9) {
        state.moving.push({
          type: node.type,
          path: path,
          pathIndex: 0,
          progress: 0
        });
      }
    }
  }

  const moveSpeed = 1.2 + state.speedLevel * 0.5;

  for (let i = state.moving.length - 1; i >= 0; i--) {
    const item = state.moving[i];
    item.progress += moveSpeed * (dt / 1000);

    if (item.progress >= 1) {
      item.progress = 0;
      item.pathIndex++;
      if (item.pathIndex >= item.path.length - 1) {
        const [fx, fy] = item.path[item.path.length - 1];
        const key = `${fx},${fy}`;
        if (!state.forgeBuffers.has(key)) state.forgeBuffers.set(key, { iron: 0, mana: 0 });
        const buf = state.forgeBuffers.get(key);
        if (item.type === 'iron') buf.iron++;
        if (item.type === 'mana') buf.mana++;

        // Forja tan pronto como tenga materiales
        while (buf.iron >= 2 && buf.mana >= 1) {
          buf.iron -= 2;
          buf.mana -= 1;
          state.swords++;
          state.swordsThisWave++;
        }

        state.moving.splice(i, 1);
      }
    }
  }

  while (state.swords > 0 && state.enemyHp > 0) {
    state.swords--;
    state.enemyHp -= state.dmgPerSword;
  }

  if (state.enemyHp <= 0) {
    state.gold += 8 + state.wave * 2;
    state.wave++;
    state.swordsThisWave = 0;
    state.enemyMaxHp = Math.floor(10 * Math.pow(1.15, state.wave - 1));
    state.enemyHp = state.enemyMaxHp;
    saveGame();
  }

  updateUI();
}

const factoryCanvas = document.getElementById('factoryCanvas');
const battleCanvas  = document.getElementById('battleCanvas');
const fCtx = factoryCanvas.getContext('2d');
const bCtx = battleCanvas.getContext('2d');

function resizeCanvases() {
  factoryCanvas.width  = factoryCanvas.clientWidth;
  factoryCanvas.height = factoryCanvas.clientHeight;
  battleCanvas.width   = battleCanvas.clientWidth;
  battleCanvas.height  = battleCanvas.clientHeight;
  updateOrigin();
}
window.addEventListener('resize', resizeCanvases);
resizeCanvases();

function drawDiamond(ctx, x, y, color) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + TILE_W / 2, y + TILE_H / 2);
  ctx.lineTo(x, y + TILE_H);
  ctx.lineTo(x - TILE_W / 2, y + TILE_H / 2);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#5a4a3a';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function renderFactory() {
  fCtx.clearRect(0, 0, factoryCanvas.width, factoryCanvas.height);

  for (let gy = GRID - 1; gy >= 0; gy--) {
    for (let gx = 0; gx < GRID; gx++) {
      const { x, y } = gridToScreen(gx, gy);
      const node = state.grid[gy][gx];
      let color = '#2a2218';
      if (node?.type === 'iron')  color = '#8a7a5a';
      if (node?.type === 'mana')  color = '#5a6a8a';
      if (node?.type === 'forge') color = '#8a5a4a';
      if (node?.type === 'path')  color = '#6a5a7a';
      drawDiamond(fCtx, x, y, color);

      if (node) {
        fCtx.fillStyle = '#fff';
        fCtx.font = '12px Courier New';
        fCtx.textAlign = 'center';
        const label = node.type === 'iron' ? 'H' : node.type === 'mana' ? 'M' : node.type === 'forge' ? 'F' : '·';
        fCtx.fillText(label, x, y + TILE_H / 2 + 5);
      }
    }
  }

  for (const item of state.moving) {
    const idx = item.pathIndex;
    if (idx >= item.path.length - 1) continue;
    const [ax, ay] = item.path[idx];
    const [bx, by] = item.path[idx + 1];
    const posA = gridToScreen(ax, ay);
    const posB = gridToScreen(bx, by);
    const t = Math.min(1, item.progress);
    const x = posA.x + (posB.x - posA.x) * t;
    const y = posA.y + (posB.y - posA.y) * t;

    const color = item.type === 'iron' ? '#f0d080' : '#80d0f0';
    fCtx.fillStyle = color;
    fCtx.beginPath();
    fCtx.arc(x, y + 16, 7, 0, Math.PI * 2);
    fCtx.fill();
  }
}

function renderBattle() {
  const w = battleCanvas.width;
  const h = battleCanvas.height;
  bCtx.clearRect(0, 0, w, h);
  bCtx.fillStyle = '#1a1520';
  bCtx.fillRect(0, 0, w, h);

  const pathY = h * 0.55;
  const margin = 30;
  bCtx.strokeStyle = '#7a6a5a';
  bCtx.lineWidth = 22;
  bCtx.lineCap = 'round';
  bCtx.beginPath();
  bCtx.moveTo(margin, pathY);
  bCtx.lineTo(w - margin - 30, pathY);
  bCtx.stroke();

  const castleX = w - margin - 15;
  bCtx.fillStyle = '#3a2a1a';
  bCtx.fillRect(castleX - 25, pathY - 60, 55, 120);
  bCtx.fillStyle = '#2a1a0a';
  bCtx.fillRect(castleX - 20, pathY - 40, 45, 80);
  bCtx.fillStyle = '#d4a574';
  bCtx.font = 'bold 13px Courier New';
  bCtx.textAlign = 'center';
  bCtx.fillText('CASTILLO', castleX + 2, pathY + 75);

  const progress = Math.max(0, 1 - (state.enemyHp / state.enemyMaxHp));
  const ex = margin + 30 + progress * (w - margin * 2 - 100);
  const ey = pathY;

  bCtx.fillStyle = '#d04040';
  bCtx.beginPath();
  bCtx.arc(ex, ey, 26, 0, Math.PI * 2);
  bCtx.fill();
  bCtx.strokeStyle = '#900000';
  bCtx.lineWidth = 3;
  bCtx.stroke();

  bCtx.fillStyle = '#fff';
  bCtx.beginPath();
  bCtx.arc(ex - 8, ey - 6, 4, 0, Math.PI * 2);
  bCtx.arc(ex + 8, ey - 6, 4, 0, Math.PI * 2);
  bCtx.fill();
  bCtx.fillStyle = '#000';
  bCtx.beginPath();
  bCtx.arc(ex - 8, ey - 6, 2, 0, Math.PI * 2);
  bCtx.arc(ex + 8, ey - 6, 2, 0, Math.PI * 2);
  bCtx.fill();

  bCtx.fillStyle = '#fff';
  bCtx.font = 'bold 12px Courier New';
  bCtx.textAlign = 'center';
  bCtx.fillText('ENEMIGO', ex, ey + 42);

  const barW = 140;
  const barX = ex - barW / 2;
  const barY = ey - 50;
  bCtx.fillStyle = '#222';
  bCtx.fillRect(barX, barY, barW, 12);
  bCtx.fillStyle = '#e04040';
  const hpRatio = Math.max(0, state.enemyHp / state.enemyMaxHp);
  bCtx.fillRect(barX, barY, barW * hpRatio, 12);
  bCtx.strokeStyle = '#666';
  bCtx.lineWidth = 1;
  bCtx.strokeRect(barX, barY, barW, 12);

  bCtx.fillStyle = '#e0d8c8';
  bCtx.font = 'bold 15px Courier New';
  bCtx.textAlign = 'left';
  bCtx.fillText(`Oleada ${state.wave}`, 14, 24);
  bCtx.font = '12px Courier New';
  bCtx.fillText(`HP: ${Math.max(0, state.enemyHp)} / ${state.enemyMaxHp}`, 14, 42);
}

let lastTime = performance.now();
function render(now = performance.now()) {
  const dt = now - lastTime;
  lastTime = now;
  simulationTick(dt);
  renderFactory();
  renderBattle();
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function selectPlace(type) {
  state.selectedPlace = type;
  document.querySelectorAll('.buttons button').forEach(b => b.classList.remove('active'));
  const names = { iron: 'Extractor Hierro', mana: 'Extractor Maná', forge: 'Nodo de Forja', path: 'Camino' };
  document.getElementById('selectedText').textContent = type ? names[type] : 'Nada seleccionado';
  if (type === 'iron')  document.getElementById('btnIron').classList.add('active');
  if (type === 'mana')  document.getElementById('btnMana').classList.add('active');
  if (type === 'forge') document.getElementById('btnForge').classList.add('active');
  if (type === 'path')  document.getElementById('btnPath').classList.add('active');
}

factoryCanvas.addEventListener('click', (e) => {
  if (!state.selectedPlace) return;
  const rect = factoryCanvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const { x: gx, y: gy } = screenToGrid(sx, sy);

  if (!isValid(gx, gy)) return;
  if (state.grid[gy][gx]) return;

  const costs = { iron: 15, mana: 15, forge: 40, path: 5 };
  const cost = costs[state.selectedPlace];
  if (state.gold < cost) return;

  state.gold -= cost;
  state.grid[gy][gx] = { type: state.selectedPlace };
  saveGame();
  updateUI();
});

function updateUI() {
  const buf = getTotalBuffers();
  document.getElementById('gold').textContent = state.gold;
  document.getElementById('swords').textContent = state.swords;
  document.getElementById('ironBuf').textContent = buf.iron;
  document.getElementById('manaBuf').textContent = buf.mana;
  document.getElementById('dmg').textContent = state.dmgPerSword;
  document.getElementById('swordsThisWave').textContent = state.swordsThisWave;
  document.getElementById('wave').textContent = state.wave;
  document.getElementById('enemyHp').textContent = `${Math.max(0, state.enemyHp)} / ${state.enemyMaxHp}`;
  const prog = Math.round((1 - state.enemyHp / state.enemyMaxHp) * 100);
  document.getElementById('waveProg').textContent = `${prog}%`;

  const statusEl = document.getElementById('flowStatus');
  if (state.hasActiveFlow) {
    statusEl.textContent = 'Flujo activo — recursos en camino';
    statusEl.className = 'status';
  } else {
    statusEl.textContent = 'Sin flujo: conecta extractores a forja con caminos';
    statusEl.className = 'status bad';
  }

  document.getElementById('costDmg').textContent = getUpgradeCost('dmg');
  document.getElementById('costProd').textContent = getUpgradeCost('prod');
  document.getElementById('costSpeed').textContent = getUpgradeCost('speed');

  document.getElementById('btnUpDmg').disabled = state.gold < getUpgradeCost('dmg');
  document.getElementById('btnUpProd').disabled = state.gold < getUpgradeCost('prod');
  document.getElementById('btnUpSpeed').disabled = state.gold < getUpgradeCost('speed');
}

loadGame();
updateUI();
setInterval(saveGame, 10000);
</script>
</body>
</html>
